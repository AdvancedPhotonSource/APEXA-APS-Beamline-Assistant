[project]
name = "beamline-assistant"
version = "2.0.0"
description = "APEXA - Advanced Photon EXperiment Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core
    "httpx>=0.28.1",
    "pydantic>=2.11,<3",  # shared execution/scientific outcome contracts
    "mcp>=2.2,<3",
    # OpenAI-compatible transport (Argo's native /v1). Gives APEXA structured
    # multi-turn tool calling — role:"tool" + tool_call_id — which Argo
    # /chat/ cannot carry. See apexa_provider_openai.py.
    "openai>=1.40",
    "python-dotenv>=1.1.1",
    # Personal API keys for off-site profiles (apexa_profiles) go to the OS
    # keyring — macOS Keychain / Windows Credential Manager / Secret Service —
    # never into .env, which on a beamline host sits on shared storage and is
    # copied between users during setup. Makes no network call, so the base
    # install stays offline-clean. Every call site degrades to the
    # APEXA_LLM_API_KEY env var if no backend is usable.
    "keyring>=25.0",
    # Web UI
    "fastapi>=0.116.2",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
    "python-multipart>=0.0.20",
    # Gradio UI
    "gradio>=6.3.0",
    # Scientific
    "numpy>=2.3.3",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "fabio>=2024.9.0",
    "tifffile>=2024.1.0",
    "xrayutilities>=1.7.12",
    "h5py>=3.11.0",
    "zarr>=2.18.0,<3",
    "pillow>=11.3.0",
    "pandas>=2.3.2",
    # Trame Web UI
    "trame>=3.6.0",
    "trame-vuetify>=2.7.0",
    "trame-plotly>=3.0.0",
    "trame-components>=2.4.0",
    # CLI
    "prompt-toolkit>=3.0.0",
    "psutil>=5.9.0",  # kill a server's process tree on Ctrl-C abort (cross-platform)
    # FF-HEDM workflow graph (APEXA_WORKFLOW_MODE=graph): deterministic ordering +
    # human-in-the-loop gates + checkpoint/resume. Pure-Python, no LangChain model
    # packages needed — graph nodes call ArgoProvider + execute_tool_call directly.
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "aiosqlite>=0.20.0",  # durable FF-HEDM graph checkpoint (AsyncSqliteSaver, Phase 2)
    # Knowledge base / RAG
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # transformers 5.x removed BertModel.get_extended_attention_mask, which the
    # Nomic embedder's trust_remote_code module (modeling_hf_nomic_bert.py) calls.
    # Every query_hedm_knowledge and capsule retrieval fails with
    # "'NomicBertModel' object has no attribute 'get_extended_attention_mask'".
    # Lift only after the embedder is revalidated (or APEXA_EMBED_MODEL moves).
    "transformers<5",
    # NOTE: sparse BM25 for hybrid retrieval is vendored in-tree
    # (knowledge_base/hybrid_retrieval.py: BM25Okapi, numpy-only) — NOT a pip dep.
    # rank-bm25 was pure-Python but its WHEEL still has to be fetched from PyPI at
    # `uv sync` time, which fails on an air-gapped beamline host (copland) that
    # never cached it. Inlining the ~30-line Okapi formula keeps the base install
    # truly offline-clean while leaving hybrid retrieval fully functional offline.
    "pypdf2>=3.0.0",
    # read_document parsers (graceful zip+XML fallback if any are missing)
    "pypdf>=4.0.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # mp-api (Materials Project) moved to the optional `mp` extra below — it is an
    # inherently online service (no offline story), pulls the large pymatgen tree,
    # and is only used by the web-only, tier-gated `fetch_cif_from_mp` tool (which
    # already returns a structured "not installed" error when absent). Keeping it
    # out of the base lets a no-public-internet host (e.g. copland) `uv sync` clean.
    "dspy>=3.2.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext>=0.7.5",
    "einops>=0.8.2",
    # NOTE: midas-suite moved OUT of base to the opt-in `[midas]` extra below.
    # APEXA routes to a NATIVE MIDAS install (point APEXA_MIDAS_BIN at the
    # operator's gate-checked pip env's bin/), so bundling a second copy into
    # APEXA's own .venv only invites version skew — the exact class of failure
    # that produced a void calibration (APEXA .venv midas-calibrate-v2 0.5.3 vs
    # the operator's gate-checked 0.22.0). Install with `uv sync --extra midas`
    # only on a host WITHOUT a native MIDAS to route to.
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# Native MIDAS reconstruction stack, pip flavor. OPT-IN — do NOT add to base.
# Prefer routing to an existing native install via APEXA_MIDAS_BIN; install this
# extra only on a host that has no native MIDAS to point at (e.g. a dev laptop).
# Keeping it opt-in avoids installing a second midas-suite into APEXA's .venv that
# can drift from the operator's gate-checked version (the calibration-void failure).
# midas-suite native stack (midas-index, midas-fit-grain, ...) compiles C/C++/CUDA
# and has no Windows wheels — the `sys_platform` guard keeps `uv sync --extra midas`
# clean on native Windows (run MIDAS HEDM tools under WSL2/Linux instead).
# Floor at 0.7.3: the suite's own dep list floors correctness fixes that a stale
# >=0.4.0 pin would let a locked/offline install resolve *below* —
# process-grains>=0.7.0 (grain-selection keys silently parsed-then-DISCARDED:
# 23710 vs 6132 grains; GrainRadius 5.5x low), fit-grain>=0.7.0, pipeline>=0.8.2,
# nf-pipeline>=0.6.1.
midas = [
    "midas-suite[ff,nf,pdf,defect,dfxm,xaf,ultrafast,grain-odf,pf-odf,pink]>=0.7.3 ; sys_platform != 'win32'",
]

# ALCF Inference Service (multi-user, per-user Globus identity).
# Only needed for APEXA_LLM_PRESET=alcf-*; see docs/ALCF_MULTIUSER.md
alcf = ["globus-sdk>=3.40", "openai>=1.40"]

# Materials Project CIF fetch (fetch_cif_from_mp). Online-only service; pulls the
# large pymatgen dependency tree. Install with `uv sync --extra mp` on a host that
# has public internet (APEXA_NETWORK=web). Omit on offline/internal-only hosts —
# the tool degrades to a structured "mp-api not installed" error.
mp = ["mp-api>=0.41.0"]

# Beamline alignment (apexa_alignment_server) — Bayesian optimization + live PV
# Access streaming. OPT-IN by design — the base alignment server works offline
# (history ingestion, DB query, analytical rotation-axis fit via algotom).
# `xopt`: SLAC/LCLS BO + VOCS schema; pure Python, offline-safe. Backs the
# saxs_beam_center_on_beamstop and slit_tune_for_ic_target tasks.
# `pvapy`: PV Access binding, used by grab_pva_frame to read the same stream
# the ImageJ PVA plugin reads. Requires EPICS7; most beamlines have it. On a
# host without EPICS7 the task refuses with a structured error.
# `algotom`: Vo's center-of-rotation (fit_rotation_axis). Already pulled into
# the base install for the current rotation-axis fit code path; listed here
# too so the alignment extra is self-contained for a fresh env.
# `scikit-image`: used by analyze_detector_frame for beam/beamstop centroids
# via gaussian_filter.  Already in base; listed here for the same reason.
alignment = [
    "xopt>=2.4",
    "pvapy>=5.5 ; sys_platform != 'win32'",
    "algotom>=1.6",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

# Tomography (TomoPy): there is deliberately NO `tomo` pip extra. The whole stack —
# `tomopy`, `dxchange`, `astra-toolbox` — is conda-forge only (PyPI `dxchange` is a
# stale 0.0.1 placeholder, and `dxchange>=…` makes the lock unsatisfiable), so there is
# no working pip backend to offer. APEXA routes to a NATIVE tomo conda env via
# APEXA_TOMO_PYTHON (see docs/TOMO_SETUP.md); `_tomo_runner.py` imports tomopy/dxchange
# ONLY under that interpreter. APEXA's own `.venv` needs nothing for tomo:
# `tomo_server.py` imports only mcp+stdlib, and the runner's pure-numpy guard helpers
# (unit-tested here) use numpy, already in base. Base `uv sync` is therefore untouched.

# Extra scientific packages (not currently imported but useful for future)
extra = [
    "plotly>=6.3.0",
    "seaborn>=0.13.2",
    "scikit-image>=0.25.2",
    "pyfai>=2025.3.0",
    "lmfit>=1.3.4",
    "vtk>=9.3.0",
    "trame-vtk>=2.8.0",
    "rich>=14.1.0",
    "typer>=0.17.4",
    "orjson>=3.11.3",
]

# Test runner. A dependency GROUP, not an extra: `uv run` picks it up automatically
# on a dev machine and `uv sync` for a beamline host never installs it. It was
# previously declared nowhere at all -- the 185-test suite ran off an ad-hoc
# `uv pip install pytest` that the next `uv sync` silently removed, leaving a repo
# whose tests could not be run reproducibly by anyone who cloned it.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
