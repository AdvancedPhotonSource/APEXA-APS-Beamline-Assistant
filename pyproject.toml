[project]
name = "beamline-assistant"
version = "2.0.0"
description = "APEXA - Advanced Photon EXperiment Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core
    "httpx>=0.28.1",
    "mcp>=1.14.1",
    # OpenAI-compatible transport (argo-proxy). Gives APEXA structured
    # multi-turn tool calling — role:"tool" + tool_call_id — which Argo
    # /chat/ cannot carry. See apexa_provider_openai.py.
    "openai>=1.40",
    "python-dotenv>=1.1.1",
    # Web UI
    "fastapi>=0.116.2",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
    "python-multipart>=0.0.20",
    # Gradio UI
    "gradio>=6.3.0",
    # Scientific
    "numpy>=2.3.3",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "fabio>=2024.9.0",
    "tifffile>=2024.1.0",
    "xrayutilities>=1.7.12",
    "h5py>=3.11.0",
    "zarr>=2.18.0,<3",
    "pillow>=11.3.0",
    "pandas>=2.3.2",
    # Trame Web UI
    "trame>=3.6.0",
    "trame-vuetify>=2.7.0",
    "trame-plotly>=3.0.0",
    "trame-components>=2.4.0",
    # CLI
    "prompt-toolkit>=3.0.0",
    "psutil>=5.9.0",  # kill a server's process tree on Ctrl-C abort (cross-platform)
    # FF-HEDM workflow graph (APEXA_WORKFLOW_MODE=graph): deterministic ordering +
    # human-in-the-loop gates + checkpoint/resume. Pure-Python, no LangChain model
    # packages needed — graph nodes call ArgoProvider + execute_tool_call directly.
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "aiosqlite>=0.20.0",  # durable FF-HEDM graph checkpoint (AsyncSqliteSaver, Phase 2)
    # Knowledge base / RAG
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # NOTE: sparse BM25 for hybrid retrieval is vendored in-tree
    # (knowledge_base/hybrid_retrieval.py: BM25Okapi, numpy-only) — NOT a pip dep.
    # rank-bm25 was pure-Python but its WHEEL still has to be fetched from PyPI at
    # `uv sync` time, which fails on an air-gapped beamline host (copland) that
    # never cached it. Inlining the ~30-line Okapi formula keeps the base install
    # truly offline-clean while leaving hybrid retrieval fully functional offline.
    "pypdf2>=3.0.0",
    # read_document parsers (graceful zip+XML fallback if any are missing)
    "pypdf>=4.0.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # mp-api (Materials Project) moved to the optional `mp` extra below — it is an
    # inherently online service (no offline story), pulls the large pymatgen tree,
    # and is only used by the web-only, tier-gated `fetch_cif_from_mp` tool (which
    # already returns a structured "not installed" error when absent). Keeping it
    # out of the base lets a no-public-internet host (e.g. copland) `uv sync` clean.
    "dspy>=3.2.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext>=0.7.5",
    "einops>=0.8.2",
    # MIDAS native stack (midas-index, midas-fit-grain, ...) compiles C/C++/CUDA and
    # has no Windows wheels — skip it on native Windows so `uv sync` installs cleanly
    # (CLI/agent/core work; run MIDAS HEDM tools under WSL2/Linux). Unchanged elsewhere.
    # Floor at 0.7.3: the suite's own dep list floors correctness fixes that a
    # stale >=0.4.0 pin would let a locked/offline install resolve *below* —
    # process-grains>=0.7.0 (grain-selection keys silently parsed-then-DISCARDED:
    # 23710 vs 6132 grains; GrainRadius 5.5x low), fit-grain>=0.7.0, pipeline>=0.8.2,
    # nf-pipeline>=0.6.1. `nf` extra added (APEXA has NF tools: run_nf_hedm_reconstruction,
    # refine_nf_parameters, preprocess_nf_data).
    "midas-suite[ff,nf,pdf,defect,dfxm,xaf,ultrafast,grain-odf,pf-odf,pink]>=0.7.3 ; sys_platform != 'win32'",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# ALCF Inference Service (multi-user, per-user Globus identity).
# Only needed for APEXA_LLM_PRESET=alcf-*; see docs/ALCF_MULTIUSER.md
alcf = ["globus-sdk>=3.40", "openai>=1.40"]

# Materials Project CIF fetch (fetch_cif_from_mp). Online-only service; pulls the
# large pymatgen dependency tree. Install with `uv sync --extra mp` on a host that
# has public internet (APEXA_NETWORK=web). Omit on offline/internal-only hosts —
# the tool degrades to a structured "mp-api not installed" error.
mp = ["mp-api>=0.41.0"]

# Extra scientific packages (not currently imported but useful for future)
extra = [
    "plotly>=6.3.0",
    "seaborn>=0.13.2",
    "scikit-image>=0.25.2",
    "pyfai>=2025.3.0",
    "lmfit>=1.3.4",
    "vtk>=9.3.0",
    "trame-vtk>=2.8.0",
    "rich>=14.1.0",
    "typer>=0.17.4",
    "orjson>=3.11.3",
]
