# Maximize a diode reading by scanning a single motor (the "hotspot finder").
# Simplest case — 1D grid scan + Gaussian fit, no BO needed.
name: diode_max_1d_scan
description: "Bounded 1D diode scan in simulation, replay or read-only shadow; quality-gated Gaussian peak recommendation."
implementation:
  recipe: bounded_grid_gaussian_v1
  modes: [simulation, replay, shadow]
  hardware_execution: false
  contract: docs/ALIGNMENT_RUNTIME.md
beamline: "1-ID-E"
technique: beam_steering
scope:
  requires: [one scalar diode PV, one motor with a known safe scan range]
devices:
  motors: [SCAN_MOTOR]           # resolved per invocation
  observations:
    - type: epics_ca
      pv_from_arg: diode_pv
      reducer: time_average
      integration_s: 0.5
vocs:
  variables:
    SCAN_MOTOR: [-5.0, 5.0]      # mm or deg; task caller provides real bounds
  objectives:
    diode_current: MAXIMIZE
algorithm:
  class: "scan_then_fit"
  grid_points: 21                # 21 points across the range
  fit_model: gaussian_plus_offset
  convergence:
    peak_fit_r2: 0.90            # Gaussian fit must explain >=90% variance
    peak_width_fraction_of_range: 0.25  # Gaussian FWHM / full scan span
prior_source: exact_recipe_configuration_revision_and_mode
success_criteria:
  - "fitted peak position within scan range"
  - "fit R^2 >= 0.90"
notes:
  - "One implemented scan recipe; the 2D slit_tune_for_ic_target task remains a specification."
  - "The Gaussian + offset model (not pure Gaussian) handles the dark-current / background floor correctly."
  - "If quality checks fail, status='partial' includes a provisional sampled-maximum recommendation. No mode commands a motor or moves to a recommendation."
  - "Legacy ingested history never automatically seeds this runtime. Matching accepted runtime fits may initialize the mathematical fit only."
