site_name: APEXA Documentation
site_description: Advanced Photon EXperiment Assistant for synchrotron diffraction analysis, tomography workflows, and instrument control
site_author: Pawan Tripathi, Advanced Photon Source
repo_url: https://github.com/AdvancedPhotonSource/APS-Beamline-Assistant
repo_name: AdvancedPhotonSource/APS-Beamline-Assistant

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quickstart.md
      - Windows Setup: WINDOWS_SETUP.md
  - User Guide:
      - Canvas Workspace: CANVAS_WORKSPACE.md
      - Powder Refinement: powder-refinement.md
      - GSAS-II Canvas Workbench: gsas2-workbench.md
      - Diffraction Software Survey: diffraction-software-survey.md
      - Phase-Transformation Dynamics: phase-transformation-dynamics.md
      - Shared Sessions: SESSIONS.md
      - Tomography Setup: TOMO_SETUP.md
  - Technical Reference:
      - Compute Dispatch: COMPUTE_DISPATCH.md
      - APS Readiness: APS_READINESS.md
  - Setup & Deployment:
      - Beamline Setup: setup/beamline-setup.md
      - Deployment Guide: setup/deployment.md
      - Fix Calibration: setup/fix-calibration.md
      - MIDAS Setup: MIDAS_SETUP.md
      - Deployment Modes: DEPLOYMENT_MODES.md
      - Offline Deployment: OFFLINE_DEPLOYMENT.md
  - Development:
      - Repository Layout: REPOSITORY_LAYOUT.md
      - Quality Gates: development/quality-gates.md
      - Architecture: development/architecture.md
      - Adding New Servers: development/adding-servers.md
      - Web UI Review: WEBUI_REVIEW.md
      - Product Audit: PRODUCT_AUDIT.md
