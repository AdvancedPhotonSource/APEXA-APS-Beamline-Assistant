<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 112">
  <title>APEXA — Advanced Photon EXperiment Assistant</title>
  <desc>Gold-on-indigo glass APEXA mark with custom geometric indigo lettering.</desc>
  <g transform="translate(8 8)">
  <defs>
    <clipPath id="tile"><rect width="96" height="96" rx="20"/></clipPath>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#416be6"/>
      <stop offset="1" stop-color="#263b94"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#7393bd"/>
      <stop offset="1" stop-color="#385c90"/>
    </linearGradient>
    <linearGradient id="ink" x2=".7" y2="1">
      <stop stop-color="#ffe5a2"/>
      <stop offset=".48" stop-color="#fff6d2"/>
      <stop offset="1" stop-color="#ffe08b"/>
    </linearGradient>
    <linearGradient id="beam">
      <stop stop-color="#b47b17"/>
      <stop offset=".35" stop-color="#e5b74b"/>
      <stop offset=".62" stop-color="#fff0ad"/>
      <stop offset="1" stop-color="#ce942a"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation=".4"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="96" height="96" fill="url(#glass)"/>
    <g fill="none" stroke="#dce8ff" stroke-width=".9" filter="url(#soft)">
      <circle cx="48" cy="48" r="24" opacity=".06"/>
      <circle cx="48" cy="48" r="34" opacity=".1"/>
      <circle cx="48" cy="48" r="43" opacity=".06"/>
    </g>
    <path d="M0 0h96v27C66 22 34 43 0 35Z" fill="#fff" opacity=".025"/>
  </g>
  <rect x="1.5" y="1.5" width="93" height="93" rx="18.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <path d="M24 76 48 20 72 76" fill="none" stroke="#91640c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".4" transform="translate(0 .7)"/>
  <path d="M24 76 48 20 72 76" fill="none" stroke="url(#ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10" y="55.5" width="56" height="5" rx="2.5" fill="url(#beam)" stroke="#b47b17" stroke-width=".45"/>
  <path d="M13 56.4h50" stroke="#fff9db" stroke-width=".65" stroke-linecap="round" opacity=".8"/>
  <path d="m48 52 5 6-5 6-5-6Z" fill="#fffef5" stroke="#b78c36" stroke-width=".4"/>
  <path d="m48 52 5 6h-5Z" fill="#f6e5b7"/>
  </g>
  <!-- Custom vector lettering: no installed or external font is required. -->
  <g transform="translate(128 32)" fill="none" stroke="#2b439c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 46 17 0 34 46M6 31h22"/>
    <path d="M51 46V0h16q15 0 15 14T67 28H51"/>
    <path d="M128 0H100v46h28M100 23h23"/>
    <path d="m146 0 31 46m0-46-31 46"/>
    <path d="m194 46 17-46 17 46m-28-15h22"/>
  </g>
</svg>
