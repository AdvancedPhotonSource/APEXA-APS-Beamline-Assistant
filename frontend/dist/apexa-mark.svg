<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>APEXA — photon beam, crystal and diffraction rings</title>
  <rect width="96" height="96" rx="20" fill="#2443b0"/>
  <!-- The transmitted beam and diffracted cone meet a tilted detector plane. -->
  <path d="M33 53 66 15 79 79Z" fill="#00d0e5" opacity=".12"/>
  <g fill="none" stroke="#00d0e5" stroke-linecap="round">
    <path d="M5 53h28" stroke-width="4"/>
    <path d="m33 53 37-6m-37 6 33-38m-33 38 46 26" stroke-width="1.8" opacity=".65"/>
    <g transform="rotate(-12 70 47)" stroke-width="2.3">
      <ellipse cx="70" cy="47" rx="6" ry="11"/>
      <ellipse cx="70" cy="47" rx="12" ry="22"/>
      <ellipse cx="70" cy="47" rx="18" ry="33"/>
    </g>
  </g>
  <!-- The A remains readable at toolbar size; its crossbar is the beam/sample. -->
  <path d="M14 76 34 20 54 76M22 55h24" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m33 47 6 6-6 6-6-6Z" fill="#00d0e5" stroke="#2443b0" stroke-width="1.5"/>
  <circle cx="33" cy="53" r="2" fill="#fff"/>
  <!-- Discrete bright reflections distinguish a diffraction pattern from an orbit. -->
  <g fill="#fff">
    <circle cx="63.1" cy="14.7" r="2.6"/>
    <circle cx="86.4" cy="62.7" r="2.6"/>
    <circle cx="58.3" cy="49.5" r="2.3"/>
    <circle cx="74.6" cy="68.5" r="2.3"/>
    <circle cx="75.9" cy="45.8" r="2"/>
  </g>
</svg>
